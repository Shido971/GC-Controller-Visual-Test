name: build

on:
  push:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex. v0.2.0). Vide = simple build."
        required: false
        default: ""

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-libusb
      - name: Build Visual Controller Test (PC)
        run: |
          cmake -S vct-pc -B vct-pc/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build vct-pc/build
          (cd vct-pc/build && ctest --output-on-failure)
          mkdir -p bin
          cp vct-pc/build/VisualControllerTest.exe bin/
          # DLL nécessaires (SDL2, libusb, runtime UCRT64)
          ldd bin/VisualControllerTest.exe | grep -i ucrt64 | awk '{print $3}' | xargs -I{} cp {} bin/
      - name: Build GTS (PC)
        run: |
          cmake -S gts-pc -B gts-pc/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build gts-pc/build
          cp gts-pc/build/GTS.exe bin/
          cp gts-pc/LICENSE bin/LICENSE-GTS.txt
          (ldd bin/GTS.exe | grep -i ucrt64 | awk '{print $3}' | xargs -r -I{} cp -u {} bin/) || true
          ls bin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Package GUI
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python tests/test_core.py
          # Lanceur PyInstaller recompilé depuis les sources : le lanceur précompilé, partagé
          # par énormément de programmes, est la première cause de fausses alertes antivirus.
          git clone --quiet --depth 1 --branch v6.22.3 https://github.com/pyinstaller/pyinstaller "$env:RUNNER_TEMP\pyinstaller"
          Push-Location "$env:RUNNER_TEMP\pyinstaller\bootloader"
          python ./waf all --target-arch=64bit
          if ($LASTEXITCODE -ne 0) { throw "compilation du lanceur PyInstaller échouée" }
          Pop-Location
          python -m pip install "$env:RUNNER_TEMP\pyinstaller"
          "BUILD = ${{ github.run_number }}`nSHA = `"${{ github.sha }}`"`n" | Set-Content -Encoding utf8 phobtool/_build.py
          pyinstaller --noconfirm packaging/phobtool.spec
      - uses: actions/upload-artifact@v4
        with:
          name: PhobGCCTool-windows
          path: dist/PhobGCCTool

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libusb-1.0-0-dev cmake
      - name: Build Visual Controller Test (PC)
        run: |
          cmake -S vct-pc -B vct-pc/build -DCMAKE_BUILD_TYPE=Release
          cmake --build vct-pc/build -j
          (cd vct-pc/build && ctest --output-on-failure)
          mkdir -p bin && cp vct-pc/build/VisualControllerTest bin/
          cmake -S gts-pc -B gts-pc/build -DCMAKE_BUILD_TYPE=Release
          cmake --build gts-pc/build -j
          cp gts-pc/build/GTS bin/ && cp gts-pc/LICENSE bin/LICENSE-GTS.txt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python -m pip install -r requirements.txt pyinstaller
          python tests/test_core.py
          printf 'BUILD = %s\nSHA = "%s"\n' "${{ github.run_number }}" "${{ github.sha }}" > phobtool/_build.py
          pyinstaller --noconfirm packaging/phobtool.spec
      - uses: actions/upload-artifact@v4
        with:
          name: PhobGCCTool-linux
          path: dist/PhobGCCTool

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Dépendances natives (SDL2, sources VCT)
        run: bash android/fetch_deps.sh
      - name: Clé de signature (secrets du dépôt)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret ANDROID_KEYSTORE_B64 absent : APK signé avec une clé temporaire, les mises à jour depuis l'appli échoueront."
          fi
      - name: Tests + APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle -p android testReleaseUnitTest assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: PhobGCCTool-android
          path: android/app/build/outputs/apk/release/app-release.apk

  # Publication des fichiers dans les Releases GitHub :
  #  - chaque push sur main met à jour la release « latest » (Dernière version)
  #  - un tag v* poussé, ou un lancement manuel avec une version, crée une release numérotée
  release:
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: [windows, linux, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}-${{ inputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Nom de la release
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"; echo "rolling=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"; echo "rolling=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"; echo "rolling=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Préparer les fichiers
        run: |
          V="${{ steps.v.outputs.tag }}"
          mkdir -p rel pkg/win pkg/linux
          cp artifacts/PhobGCCTool-android/app-release.apk "rel/PhobGCCTool-android-$V.apk"
          cp -r artifacts/PhobGCCTool-windows pkg/win/PhobGCCTool
          (cd pkg/win && zip -qr "../../rel/PhobGCCTool-windows-$V.zip" PhobGCCTool)
          cp -r artifacts/PhobGCCTool-linux pkg/linux/PhobGCCTool
          chmod +x pkg/linux/PhobGCCTool/PhobGCCTool pkg/linux/PhobGCCTool/_internal/bin/VisualControllerTest pkg/linux/PhobGCCTool/_internal/bin/GTS || true
          tar -C pkg/linux -czf "rel/PhobGCCTool-linux-$V.tar.gz" PhobGCCTool
          # description du build, lue par les applis pour détecter une mise à jour
          U="https://github.com/${GITHUB_REPOSITORY}/releases/download/$V"
          jq -n --argjson build "${{ github.run_number }}" --arg sha "$GITHUB_SHA" --arg date "$(date -u +%Y-%m-%d)" \
            --arg tag "$V" --arg u "$U" '{build:$build, sha:$sha, date:$date, tag:$tag, assets:{
              windows:{name:"PhobGCCTool-windows-\($tag).zip", url:"\($u)/PhobGCCTool-windows-\($tag).zip"},
              linux:{name:"PhobGCCTool-linux-\($tag).tar.gz", url:"\($u)/PhobGCCTool-linux-\($tag).tar.gz"},
              android:{name:"PhobGCCTool-android-\($tag).apk", url:"\($u)/PhobGCCTool-android-\($tag).apk"}}}' > rel/version.json
          cat rel/version.json
          ls -la rel
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          if [ "${{ steps.v.outputs.rolling }}" = "true" ]; then
            gh release delete latest --cleanup-tag --yes || true
            gh release create latest rel/* --target "$GITHUB_SHA" --prerelease \
              --title "Dernière version (build du $(date -u +%Y-%m-%d), ${GITHUB_SHA::7})" \
              --notes-file .github/release-notes.md
          else
            gh release create "$TAG" rel/* --target "$GITHUB_SHA" \
              --title "PhobGCC Tool $TAG" --notes-file .github/release-notes.md
          fi
